type: group
fields:
  pageTitle:
    label:
      de: Hauptüberschrift (H1, optional)
      en: Main Heading (H1, optional)
    type: text
    help:
      de: |
        Die Hauptüberschrift wird auf der Seite angezeigt wenn der Überschriftstytyp „Text“ gewählt ist. Sie wird immer für Suchmaschinen, sowie OpenGraph veröffentlicht. Wird keine angegeben, wird der Seitenname genutzt.
      en: |
        The main heading is displayed on the page when the heading variant ‘Text’ is selected. It is always published for search engines and OpenGraph. If none is specified, the page name will be used.
  headlineType:
    type: toggles
    label:
      de: Überschriftstytyp
      en: Heading Variant
    default: text
    options:
      - value: text
        text: Text
        icon: h1
      - value: image
        text:
          de: Bild
          en: Image
        icon: image
  headlineImage:
    when:
      headlineType: image
    label:
      de: Überschrift-Bild
      en: Headline-Image
    help:
      de: |
        Optional kann ein zweites Bild für den Dunkelmodus hochgeladen werden.
      en: |
        Optionally, a second image can be uploaded for dark mode.
    type: files
    max: 2
    layout: cards
    uploads: image
  headlineMaxWidth:
    when:
      headlineType: image
    label:
      de: Überschrift-Bild max. Breite
      en: Headline-Image max. width
    type: range
    min: 50
    max: 100
    default: 100
    tooltip:
      after: "%"
