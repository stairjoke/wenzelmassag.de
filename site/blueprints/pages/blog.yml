title: Blog
options:
  changeTemplate:
    - default
    - article
    - blog
    - text

tabs:
  posts:
    label:
      de: Artikel
      en: Articles
    icon: list-numbers
    sections:
      pages:
        extends: sections/pages
        layout: table
        columns:
          pubDate:
            label: pubDate
            value: "{{ page.pubDate.toDate('Y-m-d') }}"
            type: text
          tags: true
        search: true
        sortBy: status asc date desc
        template:
          - article
  settings:
    label:
      de: Einstellungen
      en: Settings
    icon: settings
    sections:
      info:
        text:
          de: |
            Seiten vom Typ „Blog“ veröffentlichen einen RSS-Feed. Enthalten sind alle Artikel und deren Inhalte.
          en: |
            Pages of the ‘Blog’ type publish an RSS feed. It includes all articles and their content.
      fields:
        fields:
          feedTitle:
            width: 1/2
            type: text
            default: "{{ site.title }} ({{ page.title }})"
            placeholder: "{{ site.title }} ({{ page.title }})"
            required: true
          categories:
            extends: fields/categorySetup
            width: 1/2
          feedDescription:
            type: text
            default: "{{ site.title }}: Subscribe to all blog-posts. {{ site.description }}"
            placeholder: "{{ site.title }}: Subscribe to all blog-posts. {{ site.description }}"
            counter: true
            help:
              de: |
                Die Beschreibung sollte unter 200 zeichen lang sein und auf einen Blick erklären, welche Inhalte im Feed zu erwarten sind.
              en: |
                The description should be less than 200 characters long and explain at a glance what kind of content can be expected in the feed.
