title: Blog
options:
  changeTemplate:
    - default
    - article
    - blog
    - text

tabs:
  posts:
    label:
      de: Artikel
      en: Articles
    icon: list-numbers
    sections:
      pages:
        extends: sections/pages
        layout: table
        columns:
          pubDate:
            label: pubDate
            value: "{{ page.pubDate.toDate('Y-m-d') }}"
            type: text
          tags: true
        search: true
        sortBy: status asc date desc
        template:
          - article
  settings:
    label:
      de: Einstellungen
      en: Settings
    icon: settings
    sections:
      fields:
        fields:
          feedTitle:
            width: 1/2
            type: text
            default: "{{ site.title }} ({{ page.title }})"
            placeholder: "{{ site.title }} ({{ page.title }})"
            required: true
          categories:
            extends: fields/categorySetup
            width: 1/2
      info:
        text:
          de: |
            Seiten vom Typ „Blog“ veröffentlichen einen Feed in RSS, Atom und JSON. Enthalten sind alle Artikel und deren Inhalte.
          en: |
            Pages of the ‘Blog’ type publish a feed in RSS, Atom and JSON. It includes all articles and their content.
