title:
  de: Text - Artikel, Blogpost
  en: Text - article, blog-post
options:
  changeTemplate:
    - article

columns:
  main:
    width: 2/3
    sections:
      fields:
        extends: groups/pageTitle
        type: fields
        fields:
          text:
            type: textarea
            size: huge
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        extends: groups/sidebarFields
        fields:
          pubDate:
            label: pubDate
          category:
            extends: fields/articleCategory
          tags:
            extends: fields/siblingTags
      files:
        type: files
