+ blueprint: page

title: Article Page

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          text:
            type: textarea
            size: huge
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          author:
            type: users
            label:
              de: Autor
              en: Author
            help:
              de: |
                Die Information wird genutzt um Metadaten zum Artikel zu veröffentlichen.
              en: |
                This data is used to publish metadata with the article.
            default: true
            max: 1
          date:
            type: date
            time: true
            label:
              de: Veröffentlichungs-Datum
              en: Publishing date
          teaser:
            type: textarea
            buttons: false
            counter: true
            help:
              de: |
                Der Teaser-Text wird im RSS-Feed und in der OpenGraph-Beschreibung genutzt. Er wird beispielsweise von Google gezeigt und sollte nicht länger als 200 Zeichen sein.
              en: |
                The teaser will be used in the RSS-feed and as OpenGraph description. Services such as Google display it inline as preview. It should not exceed 200 characters.
            label:
              de: Teaser-Text
              en: Teaser
            size: small
          category:
            type: select
            label:
              de: Kategorie
              en: Kategorie
            help:
              de: |
                Um die Liste der Kategorien zu bearbeiten, navigiere zu "Seite" und wechsle in den Tab „Open Graph Einstellungen“.
              en: |
                To edit the list of categories, navigate to "Site" and the tab “Open Graph Settings”.
            options:
              type: query
              query: site.OGCategories.split(",")
          tags:
            type: tags
            help:
              de: |
                Tags werden als Metadaten veröffentlicht.
              en: |
                Tags get published as metadata.
            options:
              type: query
              query: page.parent.childrenAndDrafts.pluck("tags", ",", true)
      files:
        help:
          de: |
            Eine Liste aller Dateien, die dieser Seite zugeordnet sind.
          en: |
            A list of all files associated with this page.
        type: files
