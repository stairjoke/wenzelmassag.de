name:
  de: Kontaktformular
  en: Contact form
icon: chat
preview: fields
tabs:
  form:
    label:
      de: Formular-Konfiguration
      en: Form config
    icon: chat
    fields:
      formFields:
        type: multiselect
        label:
          de: Formuarfelder
          en: Form fields
        layout: list
        min: 1
        options:
          name: Name
          email:
            de: E-Mail
            en: eMail
          fon:
            de: Telefon
            en: Phone
          reply-via:
            de: Antwort-Präferenz
            en: Preferred reply method
          message:
            de: Nachricht
            en: Message
          files:
            de: Dateianhang
            en: File attachments
          captcha:
            de: SPAM-Schutz
            en: SPAM-protection
      successMessage:
        type: textarea
        label:
          de: Erfolgsmeldung
          en: Success message
        help:
          de: |
            Diese Nachricht wird nach einem erfolgreichen Versand angezeigt.
          en: |
            This message will be displayed when a message was sent successfully.
        counter: true
      errorMessage:
        type: textarea
        label:
          de: Fehlermeldung
          en: Error message
        help:
          de: |
            Diese Nachricht wird nach einem fehlgeschlagenen Versand angezeigt.
          en: |
            This message will be displayed when a message fails to send.
        counter: true
